# cargo-mutants: Mutation-Tests für die Rust-Fachlogik (ADR 0007).
# Aufruf: `cargo mutants -p nunc-core -p nunc-store` (Ergebnis in mutants.out/)

# Nur Code mit Fachlogik mutieren. Tauri-Glue und OS-Adapter sind per Mutation nicht sinnvoll testbar.
exclude_globs = [
  "src-tauri/**",
  "crates/nunc-platform/**",
  "**/tests/**",
]

# Reine Darstellungs-/Diagnosecode erzeugt Rauschen ohne Aussagekraft.
exclude_re = [
  # Zeitgrenzen des HTTP-Clients und die Obergrenze einer Anfragezeile des Loopback-Servers lassen sich nicht sinnvoll
  # prüfen (ADR 0007: äquivalent bzw. nicht beobachtbar)
  "replace http_client",
  "replace < with <= in read_target",
  # Der Server prüft die angekündigte Länge vorab nur, um früh abzulehnen; `Limited` beim Lesen erzwingt dieselbe
  # Grenze, `> -> ==` ändert das Ergebnis nicht (äquivalent)
  "replace > with == in handle",
  # CRDT (ADR 0016): Bei gleichem Stempel und gleichem Wert sind beide Register identisch, `>` und `>=` liefern
  # dasselbe (äquivalent). `common <= upper.len()` wird nur erreicht, wenn `lower` nicht kleiner als `upper` ist,
  # was `position_between` voraussetzt (Eingabe außerhalb des Vertrags).
  "replace > with >= in Register<T>::merge",
  "replace < with <= in midpoint",
  # `observe` schreibt bei gleichem Stempel denselben Wert erneut (kein Unterschied). In `rekey_positions` ist der
  # Eintrag an `index` nie „behalten“, `index * 1` liefert dieselbe nächste behaltene Stelle (äquivalent).
  "replace > with >= in observe",
  "replace \\+ with \\* in rekey_positions",
  "impl (Debug|Display) for",
  "<impl Debug",
  "<impl Display",
]

# BDD-Runner (harness = false) und Unit-Tests laufen zusammen pro Mutant.
timeout_multiplier = 3.0
minimum_test_timeout = 30
