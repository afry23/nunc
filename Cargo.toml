[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["afry <vonlipwig.moist@gmail.com>"]
description = "nunc – Pomodoro- und Flowtime-Timer mit todo.txt"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
cucumber = "0.23"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

# interne Crates
nunc-core = { path = "crates/nunc-core" }
nunc-store = { path = "crates/nunc-store" }
nunc-sync = { path = "crates/nunc-sync" }
nunc-platform = { path = "crates/nunc-platform" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
