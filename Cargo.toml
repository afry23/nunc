[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["afry <vonlipwig.moist@gmail.com>"]
description = "nunc – Pomodoro- und Flowtime-Timer mit todo.txt"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# ohne "clock": die Fachlogik kann damit nicht selbst Utc::now() aufrufen (Clock wird injiziert)
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
cucumber = { version = "0.23", features = ["output-json"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
sha2 = "0.10"
wiremock = "0.6"
keyring-core = "1"
apple-native-keyring-store = "1"
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = "1"
android-native-keyring-store = "1"

# interne Crates
nunc-core = { path = "crates/nunc-core" }
nunc-store = { path = "crates/nunc-store" }
nunc-sync = { path = "crates/nunc-sync" }
nunc-platform = { path = "crates/nunc-platform" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
