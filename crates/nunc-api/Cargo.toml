[package]
name = "nunc-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Lokale HTTP-Schnittstelle (127.0.0.1, Token): todo.txt austauschen, Aufgabenstatus abfragen"
license.workspace = true

[dependencies]
nunc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log = "0.4"
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64.workspace = true
getrandom.workspace = true

[dev-dependencies]
cucumber.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "net", "time"] }

[[test]]
name = "bdd"
harness = false
