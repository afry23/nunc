name: Release

# Ein Tag `vX.Y.Z` baut Desktop (macOS, Windows, Linux) und Android und legt einen Entwurf des Releases an
# (roadmap M8-04…06). Verteilt wird nur über GitHub Releases: kein Apple-Developer-Konto, kein App Store, keine Play Console.
# Alle Secrets sind optional und stehen in docs/release.md; sie gehören ins Environment `release` (Required Reviewer).
# Ohne Apple-Zertifikat wird die macOS-App ad-hoc signiert, ohne Android-Schlüssel bleibt die APK unsigniert.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Vor dem Bauen: Version stimmt überall, alle Szenarien sind abgenommen (M8-08)
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Versionen gleich
        run: node scripts/bump-version.mjs --check "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Abnahme – keine @wip-Szenarien, jedes Szenario mit Ebene und Story
        run: npm run docs:report

  desktop:
    needs: verify
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: macos-latest,
              args: "--target aarch64-apple-darwin",
              rust-target: aarch64-apple-darwin,
            }
          - {
              os: macos-latest,
              args: "--target x86_64-apple-darwin",
              rust-target: x86_64-apple-darwin,
            }
          - { os: ubuntu-24.04, args: "", rust-target: "" }
          - { os: windows-latest, args: "", rust-target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: npm ci

      # macOS: Zertifikat in eine temporäre Keychain importieren; Tauri signiert und notarisiert über die APPLE_*-Variablen
      - name: macOS-Zertifikat importieren
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm certificate.p12

      # Leere Secrets dürfen nicht als leere Variablen ankommen: Tauri würde sie als Identität bzw. Notarisierung
      # werten. Ohne Zertifikat wird ad-hoc signiert ("-"), notarisiert nur, wenn alle drei Werte vorhanden sind.
      - name: Apple-Signierung konfigurieren
        if: runner.os == 'macOS'
        env:
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${S_IDENTITY:--}" >> "$GITHUB_ENV"
          if [ -n "$S_ID" ] && [ -n "$S_PASSWORD" ] && [ -n "$S_TEAM" ]; then
            {
              echo "APPLE_ID=$S_ID"
              echo "APPLE_PASSWORD=$S_PASSWORD"
              echo "APPLE_TEAM_ID=$S_TEAM"
            } >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: nunc ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: verify
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: NDK-Pfad setzen
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.NUNC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nunc-release.jks"
            echo "NUNC_ANDROID_KEYSTORE=$RUNNER_TEMP/nunc-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Android-Schlüssel hinterlegt, das Bundle bleibt unsigniert."
          fi

      - name: Release-Bundle (AAB) und APK
        env:
          NUNC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NUNC_ANDROID_KEYSTORE_PASSWORD }}
          NUNC_ANDROID_KEY_ALIAS: ${{ secrets.NUNC_ANDROID_KEY_ALIAS }}
          NUNC_ANDROID_KEY_PASSWORD: ${{ secrets.NUNC_ANDROID_KEY_PASSWORD }}
        run: npm run tauri android build -- --aab --apk

      # Eine APK je ABI (11–16 MB statt ≈ 57 MB universal): IzzyOnDroid nimmt höchstens 30 MB (ADR 0021).
      # Rust ist schon gebaut, der Schritt packt nur neu.
      - name: APKs je ABI
        env:
          NUNC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NUNC_ANDROID_KEYSTORE_PASSWORD }}
          NUNC_ANDROID_KEY_ALIAS: ${{ secrets.NUNC_ANDROID_KEY_ALIAS }}
          NUNC_ANDROID_KEY_PASSWORD: ${{ secrets.NUNC_ANDROID_KEY_PASSWORD }}
        run: npm run tauri android build -- --apk --split-per-abi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
            src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk

  # APKs an den Release-Entwurf hängen (zum Herunterladen und manuellen Installieren, Quelle für IzzyOnDroid). Läuft
  # erst nach `desktop`, damit der Entwurf sicher existiert und nicht doppelt angelegt wird. Die Namen sind stabil,
  # IzzyOnDroid findet die APKs per Muster (ADR 0021).
  android-asset:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: android-release

      - name: APKs an den Release anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Gradle-Ordner → Android-ABI; "universal" ergibt den bisherigen Namen ohne ABI
          for pair in universal: arm64:_arm64-v8a arm:_armeabi-v7a x86:_x86 x86_64:_x86_64; do
            dir="${pair%%:*}"
            suffix="${pair#*:}"
            apk=$(find android-release -path "*/apk/$dir/release/*.apk" | head -n 1)
            [ -n "$apk" ] || { echo "::error::Keine APK für $dir gefunden"; exit 1; }
            name="nunc_${version}_android${suffix}.apk"
            cp "$apk" "$name"
            gh release upload "$TAG" "$name" --clobber
          done
