name: Release

# Ein Tag `vX.Y.Z` baut alle Plattformen und legt einen Entwurf des Releases an (roadmap M8-04…06).
# Benötigte Secrets stehen in docs/release.md. Fehlt ein Secret, entsteht dieser Teil unsigniert bzw. wird übersprungen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NUNC_GOOGLE_CLIENT_ID: ${{ secrets.NUNC_GOOGLE_CLIENT_ID }}
  NUNC_GOOGLE_CLIENT_SECRET: ${{ secrets.NUNC_GOOGLE_CLIENT_SECRET }}
  NUNC_TODOIST_CLIENT_ID: ${{ secrets.NUNC_TODOIST_CLIENT_ID }}
  NUNC_TODOIST_CLIENT_SECRET: ${{ secrets.NUNC_TODOIST_CLIENT_SECRET }}

jobs:
  # Vor dem Bauen: Version stimmt überall, alle Szenarien sind abgenommen (M8-08)
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Versionen gleich
        run: node scripts/bump-version.mjs --check "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Abnahme – keine @wip-Szenarien, jedes Szenario mit Ebene und Story
        run: npm run docs:report

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: macos-latest,
              args: "--target aarch64-apple-darwin",
              rust-target: aarch64-apple-darwin,
            }
          - {
              os: macos-latest,
              args: "--target x86_64-apple-darwin",
              rust-target: x86_64-apple-darwin,
            }
          - { os: ubuntu-24.04, args: "", rust-target: "" }
          - { os: windows-latest, args: "", rust-target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # macOS: Zertifikat in eine temporäre Keychain importieren; Tauri signiert und notarisiert über die APPLE_*-Variablen
      - name: macOS-Zertifikat importieren
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm certificate.p12

      # Leere Secrets dürfen nicht als leere Variablen ankommen: Tauri würde sie als Identität bzw. Notarisierung
      # werten. Ohne Zertifikat wird ad-hoc signiert ("-"), notarisiert nur, wenn alle drei Werte vorhanden sind.
      - name: Apple-Signierung konfigurieren
        if: runner.os == 'macOS'
        env:
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${S_IDENTITY:--}" >> "$GITHUB_ENV"
          if [ -n "$S_ID" ] && [ -n "$S_PASSWORD" ] && [ -n "$S_TEAM" ]; then
            {
              echo "APPLE_ID=$S_ID"
              echo "APPLE_PASSWORD=$S_PASSWORD"
              echo "APPLE_TEAM_ID=$S_TEAM"
            } >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: nunc ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: NDK-Pfad setzen
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.NUNC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nunc-release.jks"
            echo "NUNC_ANDROID_KEYSTORE=$RUNNER_TEMP/nunc-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Android-Schlüssel hinterlegt, das Bundle bleibt unsigniert."
          fi

      - name: Release-Bundle (AAB) und APK
        env:
          NUNC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NUNC_ANDROID_KEYSTORE_PASSWORD }}
          NUNC_ANDROID_KEY_ALIAS: ${{ secrets.NUNC_ANDROID_KEY_ALIAS }}
          NUNC_ANDROID_KEY_PASSWORD: ${{ secrets.NUNC_ANDROID_KEY_PASSWORD }}
        run: npm run tauri android build -- --aab --apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

      # Interner Test-Track der Play Console (Paketname com.afry.nunc, App muss dort bereits angelegt sein)
      - name: In die Play Console hochladen
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.afry.nunc
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          track: internal
          status: draft

  # APK an den Release-Entwurf hängen (zum Herunterladen und manuellen Installieren). Läuft erst nach `desktop`,
  # damit der Entwurf sicher existiert und nicht doppelt angelegt wird.
  android-asset:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: APK an den Release anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=$(find android-release -name '*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::Keine APK gefunden"; exit 1; }
          name="nunc_${TAG#v}_android.apk"
          cp "$apk" "$name"
          gh release upload "$TAG" "$name" --clobber

  ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - run: brew install xcodegen

      - run: npm ci

      - name: Zertifikat und Provisioning-Profil installieren
        if: env.IOS_CERTIFICATE != ''
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/nunc.mobileprovision"
          rm certificate.p12

      - name: IPA für den App Store bauen
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: npm run tauri ios build -- --export-method app-store-connect

      - name: Zu TestFlight hochladen
        if: env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file src-tauri/gen/apple/build/arm64/nunc.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -rf "$HOME/.appstoreconnect"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: ignore
