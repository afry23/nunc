name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Änderungen nur an *.md bauen nichts. Bewusst auf Job-Ebene statt `paths-ignore` am Workflow: `checks` ist ein
  # Pflicht-Check der Branch Protection; ein übersprungener Job zählt als bestanden, ein gar nicht gestarteter
  # Workflow ließe den PR auf „Expected“ hängen.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          # ohne Vergleichsbasis (neuer Branch, erzwungener Push) wird im Zweifel gebaut
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "$GITHUB_SHA")
          echo "Geänderte Dateien:"; echo "$files"
          # alles außer *.md? (grep -v | grep -q . statt grep -qv: eindeutig in allen grep-Varianten)
          if [ -z "$files" ] || echo "$files" | grep -v '\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Nur Markdown geändert, Build übersprungen."
          fi

  # Lint + Tests (Linux). Erzeugt den Cucumber-Report als Artefakt.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux-Abhängigkeiten für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: npm ci

      - name: Frontend – typecheck, lint
        run: |
          npm run typecheck
          npm run lint

      - name: Frontend – Unit-Tests und BDD (@ui)
        run: >
          npx vitest run --passWithNoTests
          --reporter=default --reporter=junit
          --outputFile.junit=${{ github.workspace }}/target/bdd/ui.xml

      - name: Rust – fmt, clippy
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust – Tests und BDD (@domain)
        env:
          NUNC_BDD_REPORT: ${{ github.workspace }}/target/bdd/domain.json
        run: cargo test --workspace

      - name: Typ-Bridge aktuell?
        run: |
          cargo test -p nunc export_bindings
          git diff --exit-code src/bindings.ts

      # Abnahme (M8-08): keine @wip-Szenarien, jedes mit Ebene und Story; erzeugt Traceability und Living Documentation
      - name: Traceability-Report und Living Documentation
        run: npm run docs:report

      - name: Cucumber-Report hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cucumber-report
          path: |
            target/bdd/
            target/docs/
          if-no-files-found: warn

  # Desktop-Build-Matrix (ohne Installer, die entstehen in M8)
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: npm ci

      - run: npm run tauri build -- --debug --no-bundle

  # Desktop-E2E-Smoke (WebdriverIO + tauri-driver, Linux)
  e2e-desktop:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux-Abhängigkeiten für Tauri und WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libxdo-dev patchelf \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo install tauri-driver --locked

      - run: npm ci

      - name: E2E-Smoke
        run: xvfb-run --auto-servernum npm run test:e2e

  android:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: NDK-Pfad setzen
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Debug-APK (arm64)
        run: npm run tauri android build -- --debug --target aarch64 --apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  ios:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: xcodegen
        run: brew install xcodegen

      - run: npm ci

      # unsigned, Simulator-Ziel: kein Zertifikat nötig
      - name: iOS-Simulator-Build
        run: npm run tauri ios build -- --debug --target aarch64-sim

      - name: App-Bundle packen
        run: ditto -c -k --keepParent src-tauri/gen/apple/build/arm64-sim/nunc.app nunc-ios-sim.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: nunc-ios-sim.zip
