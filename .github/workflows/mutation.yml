name: Mutation tests

# Mutation-Tests für die Rust-Fachlogik (ADR 0007).
# PR: nur geänderter Code (--in-diff). Wöchentlich/manuell: vollständiger Lauf.
# Bewusst kein Pflicht-Check: nach ein paar Wochen Erfahrung in der Branch Protection ergänzen.

on:
  pull_request:
    paths:
      - "crates/nunc-core/**"
      - "crates/nunc-store/**"
      - "crates/nunc-sync/**"
      - "crates/nunc-api/**"
      - "features/**"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-mutants

      - name: Diff gegen die Zielbranch erzeugen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff

      - name: Mutation-Tests auf geändertem Code
        run: cargo mutants --in-diff pr.diff -p nunc-core -p nunc-store -p nunc-sync -p nunc-api --no-shuffle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-diff
          path: mutants.out/

  mutants-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-mutants

      - name: Vollständiger Mutation-Lauf
        run: cargo mutants -p nunc-core -p nunc-store -p nunc-sync -p nunc-api --jobs 2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-full
          path: mutants.out/
