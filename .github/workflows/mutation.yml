name: Mutation tests

# Mutation-Tests für die Rust-Fachlogik (ADR 0007).
# PR: nur geänderter Code (--in-diff). Wöchentlich/manuell: vollständiger Lauf.
# Bewusst kein Pflicht-Check: nach ein paar Wochen Erfahrung in der Branch Protection ergänzen.

on:
  pull_request:
    paths:
      - "crates/nunc-core/**"
      - "crates/nunc-store/**"
      - "crates/nunc-sync/**"
      - "crates/nunc-api/**"
      - "features/**"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-mutants

      - name: Diff gegen die Zielbranch erzeugen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff

      - name: Mutation-Tests auf geändertem Code
        run: cargo mutants --in-diff pr.diff -p nunc-core -p nunc-store -p nunc-sync -p nunc-api --no-shuffle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutants-diff
          path: mutants.out/

  mutants-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-mutants

      - name: Vollständiger Mutation-Lauf
        run: cargo mutants -p nunc-core -p nunc-store -p nunc-sync -p nunc-api --jobs 2

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutants-full
          path: mutants.out/
