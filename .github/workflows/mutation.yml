name: Mutation tests

# Mutation-Tests für die Rust-Fachlogik (ADR 0007).
# PR: nur geänderter Code (--in-diff). Wöchentlich/manuell: vollständiger Lauf.
# Bewusst kein Pflicht-Check: nach ein paar Wochen Erfahrung in der Branch Protection ergänzen.

on:
  pull_request:
    paths:
      - "crates/nunc-core/**"
      - "crates/nunc-store/**"
      - "crates/nunc-sync/**"
      - "crates/nunc-api/**"
      - "features/**"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff gegen die Zielbranch erzeugen
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: Mutation-Tests auf geändertem Code
        run: cargo mutants --in-diff pr.diff -p nunc-core -p nunc-store -p nunc-sync -p nunc-api --no-shuffle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-diff
          path: mutants.out/

  mutants-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Vollständiger Mutation-Lauf
        run: cargo mutants -p nunc-core -p nunc-store -p nunc-sync -p nunc-api --jobs 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-full
          path: mutants.out/
